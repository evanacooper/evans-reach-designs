<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel step — chosen direction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f9fafb; --surface: #fff; --border: #e5e7eb; --border-h: #d1d5db;
  --fg: #111827; --fg-2: #5b6472; --fg-3: #6b7280;
  --brand: #6d5ef7; --brand-h: #5b4de0; --brand-bg: #f5f3ff; --brand-border: #ddd6fe;
  --ok: #15803d; --ok-bg: #f0fdf4; --ok-border: #bbf7d0;
  --warn: #b45309; --warn-bg: #fffbeb; --warn-border: #fde68a;
  --goog: #1a73e8; --goog-bg: #eff6ff; --goog-border: #bfdbfe;
  --biz: #22624c;
  --r: 10px;
  --rail: 268px;
}
html, body { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; line-height: 1.5;
  color: var(--fg); background: #e8eaed; -webkit-font-smoothing: antialiased; }

/* focus is visible everywhere — the old file had zero :focus rules */
:where(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px;
}

.back-link { position: fixed; top: 14px; left: 18px; z-index: 90; display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 500; color: var(--fg-2); text-decoration: none; background: var(--surface);
  border: 1px solid var(--border); border-radius: 100px; padding: 6px 13px 6px 10px; }
.back-link:hover { color: var(--fg); }

.devbar { position: fixed; top: 0; left: 0; right: 0; z-index: 80; display: flex; flex-wrap: wrap; align-items: center;
  gap: 5px; padding: 11px 18px 11px 148px; background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border); }
.devlabel { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); margin-right: 3px; }
.devbtn { font-family: inherit; font-size: 11.5px; font-weight: 500; padding: 4px 10px; border-radius: 100px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--fg-2); white-space: nowrap; }
.devbtn:hover { border-color: var(--border-h); color: var(--fg); }
.devbtn.on { background: #1a1a2e; border-color: #1a1a2e; color: #fff; }
.devnote { font-size: 11px; color: var(--fg-3); margin-left: auto; }

.stage { padding: 62px 16px 24px; max-width: 1200px; margin: 0 auto; }

.modal { background: var(--surface); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.16);
  overflow: hidden; display: flex; flex-direction: column; min-height: 748px;
  container-type: inline-size; }
.mhead { padding: 20px 26px 16px; border-bottom: 1px solid var(--border); position: relative; }
.mhead h1 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.mhead p { font-size: 13px; color: var(--fg-2); margin-top: 3px; }
.mclose { position: absolute; top: 18px; right: 22px; background: none; border: none; cursor: pointer;
  color: var(--fg-2); font-size: 20px; line-height: 1; padding: 4px; }

.mbody { display: flex; flex: 1; min-height: 0; }
.side { width: var(--rail); flex-shrink: 0; padding: 22px 18px; border-right: 1px solid var(--border); }
.snav { display: flex; flex-direction: column; gap: 2px; }
.sitem { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px;
  font-size: 13.5px; color: var(--fg-3); border: 1.5px solid transparent; }
.sitem.cur { color: var(--fg); font-weight: 600; border-color: var(--brand); background: #fff; }
.snum { width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 700;
  color: var(--fg-3); flex-shrink: 0; }
.sitem.cur .snum { background: var(--brand); border-color: var(--brand); color: #fff; }

.main { flex: 1; padding: 24px 28px; overflow-y: auto; max-height: 648px; min-width: 0; }
.main h2 { font-size: 20px; font-weight: 700; letter-spacing: -.022em; }
.lede { font-size: 13.5px; color: var(--fg-2); margin: 5px 0 18px; }

.mfoot { padding: 14px 26px; border-top: 1px solid var(--border); display: flex; justify-content: space-between;
  align-items: center; gap: 10px; }
.mfoot-l { font-size: 12px; color: var(--fg-3); }
.btnrow { display: flex; gap: 10px; }
.btn { font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 10px 26px; border-radius: 8px;
  cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--fg); }
.btn:hover { border-color: var(--border-h); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-p { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-p:hover { background: var(--brand-h); border-color: var(--brand-h); }

/* ─── the dominant panel ─── */
.hero { border: 1.5px solid var(--brand); border-radius: 12px; overflow: hidden;
  box-shadow: 0 0 0 3px rgba(109,94,247,.08); margin-bottom: 11px; }
.hero-h { display: flex; align-items: center; gap: 12px; padding: 13px 16px;
  background: var(--brand-bg); border-bottom: 1px solid var(--brand-border); }
.hero-t { font-size: 16px; font-weight: 680; letter-spacing: -.017em; }
.rec { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand);
  background: #fff; border: 1px solid var(--brand-border); padding: 3px 9px; border-radius: 100px;
  white-space: nowrap; margin-left: auto; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border-h);
  flex-shrink: 0; background: var(--surface); }
.radio.on { border-color: var(--brand); border-width: 5.5px; }

.hero-b { display: grid; grid-template-columns: 268px 1fr; gap: 0; }
.stagecol { padding: 16px 18px 17px; border-right: 1px solid var(--border); display: flex;
  flex-direction: column; align-items: center; gap: 11px; background: #fbfcfd; }
.outcol { padding: 16px 18px 17px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }

/* phone */
.phone { width: 232px; border-radius: 26px; padding: 7px; background: #1f2937; box-shadow: 0 8px 24px rgba(0,0,0,.16); }
.pscr { background: #fff; border-radius: 20px; overflow: hidden; min-height: 302px; display: flex; flex-direction: column; }
.pband { background: var(--biz); padding: 9px 12px; display: flex; align-items: center; gap: 7px; }
.plogo { width: 20px; height: 20px; border-radius: 5px; background: rgba(255,255,255,.2); color: #fff;
  font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.pbiz { font-size: 11px; font-weight: 650; color: #fff; }
.pbody { padding: 14px 13px 15px; flex: 1; display: flex; flex-direction: column; }
.pq { font-size: 13.5px; font-weight: 700; text-align: center; line-height: 1.3; letter-spacing: -.012em; }
.psub { font-size: 10.5px; color: var(--fg-2); text-align: center; margin-top: 4px; }

/* the scale — two rows so every target clears 44px, and dark-on-pale for real contrast */
.scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 13px; }
.scale .sq:nth-child(7) { grid-column: 1 / span 1; }
.sq { min-height: 30px; aspect-ratio: 1; border: 1px solid #dbe2ea; border-radius: 7px; background: #eef2f6;
  color: #334155; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: transform .12s, background .12s; padding: 0; }
.sq:hover { background: #dde5ee; transform: translateY(-1px); }
.sq.hi { background: var(--ok); border-color: var(--ok); color: #fff; }
.sq.lo { background: var(--warn); border-color: var(--warn); color: #fff; }
.pends { display: flex; justify-content: space-between; margin-top: 7px; font-size: 9px; color: var(--fg-3); }
.pnote { margin-top: auto; padding-top: 11px; font-size: 9.5px; color: var(--fg-3); text-align: center; }

.gcard { padding: 12px; }
.grow { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
.gav { width: 24px; height: 24px; border-radius: 50%; background: var(--goog); color: #fff; font-size: 9.5px;
  font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.gname { font-size: 11px; font-weight: 600; color: #202124; }
.gsub2 { font-size: 9px; color: #5f6368; }
.gstars { display: flex; gap: 3px; justify-content: center; margin: 9px 0; }
.gstars span { font-size: 21px; color: #fbbc04; line-height: 1; }
.gbox { font-size: 9.5px; color: #80868b; border: 1px solid #e0e3e6; border-radius: 6px; padding: 8px; min-height: 44px; }
.gact { display: flex; justify-content: flex-end; gap: 12px; align-items: center; margin-top: 10px; }
.gpost { font-size: 10.5px; font-weight: 600; color: #fff; background: var(--goog); border-radius: 100px; padding: 5px 15px; }
.pta { width: 100%; border: 1px solid #dbe2ea; border-radius: 7px; padding: 8px; font-family: inherit;
  font-size: 10.5px; min-height: 62px; resize: none; margin-top: 10px; }
.pbtn { width: 100%; padding: 9px; border: none; border-radius: 7px; font-family: inherit; font-size: 11.5px;
  font-weight: 650; cursor: pointer; margin-top: 9px; background: var(--biz); color: #fff; }

.replay { font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--brand); background: none;
  border: none; cursor: pointer; padding: 3px 6px; }
.replay:hover { text-decoration: underline; }
.replay[hidden] { display: none; }

/* outcome cards — A3's branch annotation, live */
.oc { border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 13px; background: var(--surface);
  display: flex; gap: 11px; align-items: flex-start; transition: border-color .2s, background .2s, opacity .2s; }
.oc.dim { opacity: .5; }
.oc.on.hi { border-color: var(--ok-border); background: var(--ok-bg); opacity: 1; }
.oc.on.lo { border-color: var(--warn-border); background: var(--warn-bg); opacity: 1; }
.oc-k { font-size: 10px; font-weight: 800; letter-spacing: .05em; padding: 3px 8px; border-radius: 5px;
  white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
.oc.hi .oc-k { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-border); }
.oc.lo .oc-k { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
.oc.on.hi .oc-k { background: var(--ok); color: #fff; border-color: var(--ok); }
.oc.on.lo .oc-k { background: var(--warn); color: #fff; border-color: var(--warn); }
.oc-t { font-size: 13px; font-weight: 650; letter-spacing: -.01em; }
.oc-d { font-size: 11.5px; color: var(--fg-2); line-height: 1.45; margin-top: 2px; }
.oc-arrow { font-size: 13px; color: var(--fg-3); text-align: center; line-height: 1; }
.finenote { font-size: 11px; color: var(--fg-3); line-height: 1.5; padding-top: 4px; }

/* quiet alternative rows */
.alt { border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px 15px;
  width: 100%; text-align: left; font-family: inherit; cursor: pointer; display: flex; gap: 12px;
  align-items: center; margin-bottom: 9px; transition: border-color .16s; }
.alt:hover { border-color: var(--border-h); }
.alt-t { font-size: 14px; font-weight: 650; letter-spacing: -.012em; }
.tag { font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-bg);
  border: 1px solid var(--warn-border); border-radius: 100px; padding: 3px 10px; white-space: nowrap; margin-left: auto; }

/* container queries key off the modal, not the viewport — the old file's
   breakpoints measured the wrong axis and overflowed from 1024px down */
@container (max-width: 1010px) {
  .hero-b { grid-template-columns: 1fr; }
  .stagecol { border-right: none; border-bottom: 1px solid var(--border); }
}
@container (max-width: 820px) {
  .side { display: none; }
  .alt { flex-wrap: wrap; }
  .tag { margin-left: 30px; }
}
</style>
</head>
<body>

<a class="back-link" href="index.html">← Review flows</a>

<div class="devbar">
  <span class="devlabel">Preview</span>
  <button class="devbtn on" id="d-both" onclick="pick('both')">Public + private</button>
  <button class="devbtn" id="d-public" onclick="pick('public')">Public only</button>
  <button class="devbtn" id="d-private" onclick="pick('private')">Private only</button>
  <span class="devnote">Tap a number in the phone to watch the branch</span>
</div>

<div class="stage">
  <div class="modal">
    <div class="mhead">
      <h1>Set up Reputation</h1>
      <p>Choose your approach, connect Google Business Profile, configure how requests go out, and review before activating.</p>
      <button class="mclose" aria-label="Close">✕</button>
    </div>
    <div class="mbody">
      <nav class="side" aria-label="Setup steps"><div class="snav" id="snav"></div></nav>
      <div class="main" id="main"></div>
    </div>
    <div class="mfoot">
      <span class="mfoot-l">You can change any of this later.</span>
      <div class="btnrow">
        <button class="btn" disabled>Previous</button>
        <button class="btn btn-p">Next</button>
      </div>
    </div>
  </div>
</div>

<script>
const STEPS = ['Choose channels','Connect Google','Map locations','Senders','Branding','Messages','Review'];

/* Scale is config, not hardcoded. INVESTIGATION.md: live forms run 1-5 AND 1-10,
   and max_stars is per-form — so a fixed "threshold 9" silently breaks a 1-5 form. */
const SCALE = { min: 0, max: 10 };
const fastTrackFrom = () => Math.round(SCALE.min + (SCALE.max - SCALE.min) * 0.9);

const OPT = {
  both:    { label: 'Ask privately, then invite everyone to Google', google: true,  form: true,  rec: true },
  public:  { label: 'Send them straight to Google',                  google: true,  form: false, rec: false,
             tag: 'no private warning' },
  private: { label: 'Keep every answer between you and them',        google: false, form: true,  rec: false,
             tag: 'no new Google reviews' },
};

const S = { pick: 'both', score: null };

const hasForm = () => OPT[S.pick].form;
const hasGoogle = () => OPT[S.pick].google;
const isHigh = n => n >= fastTrackFrom();

function pick(k) { S.pick = k; S.score = null; render(); }
function tap(n) { S.score = n; render(); }
function replay() { S.score = null; render(); }

/* ── phone screens ── */
function scaleGrid() {
  let out = '';
  for (let n = SCALE.min; n <= SCALE.max; n++) {
    const on = S.score === n;
    const cls = on ? (hasGoogle() && hasForm() && isHigh(n) ? 'hi' : 'lo') : '';
    out += `<button class="sq ${cls}" onclick="tap(${n})" aria-label="Score ${n}">${n}</button>`;
  }
  return `<div class="scale" role="group" aria-label="Rate 0 to 10">${out}</div>`;
}

function phoneScreen() {
  if (!hasForm()) {
    if (S.score === 'go') return googleScreen();
    return `
      <div class="pbody">
        <div class="pq">How did we do?</div>
        <div class="psub">Thanks for visiting last week. A Google review really helps other pet owners find us.</div>
        <button class="pbtn" style="background:var(--goog)" onclick="tap('go')">Leave a Google review</button>
        <div class="pnote">The message they get. Tap to follow it.</div>
      </div>`;
  }
  if (S.score === null || typeof S.score === 'number') {
    const high = typeof S.score === 'number' && hasGoogle() && isHigh(S.score);
    if (high) return googleScreen();
    if (typeof S.score === 'number') return followupScreen();
    return `
      <div class="pbody">
        <div class="pq">How was your visit?</div>
        <div class="psub">Tap a number.</div>
        ${scaleGrid()}
        <div class="pends"><span>Not at all likely</span><span>Extremely likely</span></div>
        <div class="pnote">One question. Nothing else is asked until they answer.</div>
      </div>`;
  }
  return googleScreen();
}

function followupScreen() {
  const low = S.score <= 8;
  return `
    <div class="pbody">
      <div class="pq">${low ? 'Thanks for the honesty.' : 'Thanks for letting us know.'}</div>
      <div class="psub">You scored ${S.score}. Already saved.</div>
      <textarea class="pta" placeholder="${low ? 'What could we have done better?' : 'What stood out?'}"></textarea>
      <button class="pbtn">Send feedback</button>
      ${hasGoogle() ? `<div class="pnote">The Google invite comes on the next screen.</div>`
                    : `<div class="pnote">Goes to you. Nothing is published.</div>`}
    </div>`;
}

function googleScreen() {
  return `
    <div class="gcard">
      <div class="grow"><span class="gav">JD</span>
        <div><div class="gname">Jordan D.</div><div class="gsub2">Posting publicly across Google</div></div></div>
      <div class="gstars">${'<span>★</span>'.repeat(5)}</div>
      <div class="gbox">Share details of your own experience at this place</div>
      <div class="gact"><span class="gpost">Post</span></div>
    </div>`;
}

/* ── outcome cards: A3's annotation, live ── */
function outcomes() {
  const n = S.score, ft = fastTrackFrom();

  if (!hasForm()) return `
    <div class="oc hi ${n === 'go' ? 'on' : ''}">
      <span class="oc-k">EVERY ONE</span>
      <div><div class="oc-t">Straight to the Google review box</div>
      <div class="oc-d">One tap from the message. No form in between, so no score ever reaches you.</div></div>
    </div>
    <div class="finenote">Fewest steps and the most reviews. You read the unhappy ones when the public does.</div>`;

  if (!hasGoogle()) return `
    <div class="oc lo ${typeof n === 'number' ? 'on' : ''}">
      <span class="oc-k">ANY SCORE</span>
      <div><div class="oc-t">One follow-up question, straight to you</div>
      <div class="oc-d">Score and comment land in your dashboard. Google is never mentioned.</div></div>
    </div>
    <div class="finenote">A listening channel. Your public rating stays where it is.</div>`;

  const high = typeof n === 'number' && isHigh(n);
  const low  = typeof n === 'number' && !isHigh(n);
  return `
    <div class="oc hi ${high ? 'on' : ''} ${low ? 'dim' : ''}">
      <span class="oc-k">${ft} OR ${SCALE.max}</span>
      <div><div class="oc-t">Google opens instantly</div>
      <div class="oc-d">No comment box, no second question. Five stars ready to post.</div></div>
    </div>
    <div class="oc-arrow">↕</div>
    <div class="oc lo ${low ? 'on' : ''} ${high ? 'dim' : ''}">
      <span class="oc-k">${SCALE.min} TO ${ft - 1}</span>
      <div><div class="oc-t">One question first</div>
      <div class="oc-d">You hear what went wrong before anyone else does.</div></div>
    </div>
    <div class="finenote">The score changes how fast they reach Google, not whether they are asked.</div>`;
}

function render() {
  ['both','public','private'].forEach(k =>
    document.getElementById('d-' + k).classList.toggle('on', k === S.pick));

  document.getElementById('snav').innerHTML = STEPS.map((s, i) =>
    `<div class="sitem ${i === 0 ? 'cur' : ''}"><span class="snum">${i + 1}</span>${s}</div>`).join('');

  const O = OPT[S.pick];
  const others = ['both','public','private'].filter(k => k !== S.pick);

  document.getElementById('main').innerHTML = `
    <h2>How should we ask your customers?</h2>
    <p class="lede">Pick one. The preview is live, tap a number to see where that customer ends up.</p>

    <div class="hero">
      <div class="hero-h">
        <span class="radio on"></span>
        <span class="hero-t">${O.label}</span>
        ${O.rec ? '<span class="rec">Recommended</span>' : ''}
      </div>
      <div class="hero-b">
        <div class="stagecol">
          <div class="phone"><div class="pscr">
            <div class="pband"><span class="plogo">SP</span><span class="pbiz">Safari Pet Resort</span></div>
            ${phoneScreen()}
          </div></div>
          <button class="replay" onclick="replay()" ${S.score === null ? 'hidden' : ''}>↺ Start over</button>
        </div>
        <div class="outcol">${outcomes()}</div>
      </div>
    </div>

    ${others.map(k => `
      <button class="alt" onclick="pick('${k}')">
        <span class="radio"></span>
        <span class="alt-t">${OPT[k].label}</span>
        ${OPT[k].tag ? `<span class="tag">${OPT[k].tag}</span>` : ''}
      </button>`).join('')}
  `;
}

render();
</script>
</body>
</html>
